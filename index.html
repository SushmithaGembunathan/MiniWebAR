
<!DOCTYPE html>
<html>
<head>
    <title>My Mini WebAR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .heading {
            position: fixed;
            top: 15px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: white;
            text-shadow: 1px 1px 4px black;
        }
    </style>
</head>

<body>

<div class="heading">
    <h2>✨ Welcome to Mini WebAR</h2>
    <p>Scan your image to reveal the magic!</p>
</div>

<a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0"
              look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

        <!-- Floating 3D object -->
        <a-box
            position="0 0.2 0.2"
            rotation="0 45 0"
            color="#D4A373"
            animation="property: rotation;
                       to: 0 405 0;
                       loop: true;
                       dur: 4000">
        </a-box>

        <!-- Text -->
        <a-text
            value="Hello AR World!"
            position="-0.5 -0.4 0"
            color="#FFFFFF"
            width="2"
            align="center">
        </a-text>

        <!-- Floating sphere -->
        <a-sphere
            position="0.5 0.2 0.2"
            radius="0.12"
            color="#FFD166"
            animation="property: position;
                       to: 0.5 0.5 0.2;
                       dir: alternate;
                       loop: true;
                       dur: 1500">
        </a-sphere>

    </a-entity>

</a-scene>

</body>
</html>
